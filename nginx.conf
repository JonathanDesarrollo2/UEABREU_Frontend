events {}

http {
    server {
        # 🔧 PUERTO CLAVE: Cloud Run requiere el puerto 8080
        listen 8080;
        server_name localhost;
        
        # La carpeta donde están tus archivos compilados (index.html, JS, CSS)
        root /usr/share/nginx/html;
        index index.html;

        # ✅ CONFIGURACIÓN SPA: Redirige todas las rutas a index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Configuración para archivos estáticos (cache, opcional)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}