steps:
  # 1. Construir la imagen de Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '-t',
      'gcr.io/${PROJECT_ID}/ueabreu-frontend:latest',
      '.'
    ]
  
  # 2. Subir la imagen a Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/${PROJECT_ID}/ueabreu-frontend:latest'
    ]
  
  # 3. Desplegar el servicio en Cloud Run (Formato de args CORREGIDO y más robusto)
  - name: 'gcr.io/google.com/cloudsdk/cloud-sdk' # 👈 Constructor más actualizado
    args:
      - gcloud
      - run
      - deploy
      - ueabreu-frontend
      - --image
      - 'gcr.io/${PROJECT_ID}/ueabreu-frontend:latest'
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080' 

options:
  logging: CLOUD_LOGGING_ONLY