steps:
  # 1️⃣ Construir la imagen del contenedor
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/ueabreu-frontend',
      '.'
    ]

  # 2️⃣ Enviar (push) la imagen al Container Registry (o Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ueabreu-frontend']

  # 3️⃣ Desplegar a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'ueabreu-frontend',
        '--image', 'gcr.io/$PROJECT_ID/ueabreu-frontend',
        '--region', 'us-central1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '8080'
      ]

# 4️⃣ Definir las imágenes a conservar en el historial de compilaciones
images:
  - 'gcr.io/$PROJECT_ID/ueabreu-frontend'
options:
  logging: CLOUD_LOGGING_ONLY
